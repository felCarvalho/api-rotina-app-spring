services:
  postgres:
    image: 'postgres:latest'
    env_file:
      -  .env.database
    ports:
      - '${POSTGRES_PORT}:5432'
  redis:
    image: 'redis:latest'
    env_file:
      - .env.red
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '${REDIS_PORT}:6379'